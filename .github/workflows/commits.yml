---
name: Reusable Checks for quality of commit messages

on:
  workflow_call:
    inputs:
      fedora-container-image-number:
        description: "Fedora Container Image Number"
        required: true
        type: number

jobs:
  general_checks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    container:
      image: quay.io/fedora/fedora:${{ inputs.fedora-container-image-number }}
    steps:
      - name: Install dependencies
        run: dnf install -y git gitlint
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
          fetch-depth: 50
      - uses: taiki-e/install-action@v2
        with:
          tool: typos-cli
      - name: allow gitlint to process commits
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: gitlint
        run: gitlint --commits "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
      - name: check spelling
        run: git log --format=%B "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" | typos -
